# dsh-tray-launcher bundle patch: inserts the plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with `dsh plugin --profile web add dsh-tray-launcher`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the /api/dsh-tray-launcher/install route), and the
# `dsh.client` declaration in package.json makes the browser half (exports
# "./client") load in the Web GUI with the settings card.
- insert:
    - id: tray-launcher
      name: 'dsh-tray-launcher'
